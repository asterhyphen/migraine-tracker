name: migraine_tracker
description: "A migraine tracking app"
publish_to: 'none' 
version: 1.0.1+2

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  csv: ^6.0.0
  app_links: ^6.3.3
  google_fonts: ^6.3.0
  package_info_plus: ^8.1.2
  nfc_manager: ^3.5.0
  url_launcher: ^6.1.10
  flutter_riverpod: ^3.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  nfc_manager:
    path: third_party/nfc_manager

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_background: "assets/background.png"
  adaptive_icon_foreground: "assets/foreground.png"
  image_path: "assets/Icon.png"
  image_path_ios: "assets/Icon.png"
